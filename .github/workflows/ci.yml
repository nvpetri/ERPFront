name: ERPFront checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erp -d erp_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://erp:ci-only-password@localhost:5432/erp_test
      NODE_ENV: test
      API_DIR: api-contract
      SEED_COMPANY_SLUG: erp-demo
      SEED_COMPANY_NAME: Minha loja
      SEED_MANAGER_EMAIL: manager@example.test
      SEED_MANAGER_PASSWORD: ci-only-manager-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm audit --omit=dev --audit-level=high
      - name: API contract
        uses: actions/checkout@v4
        with:
          repository: nvpetri/ERPBack
          ref: f7860b92cbd28d7138206e798b4e0b1b02b545d1
          path: api-contract
      - run: npm ci --prefix api-contract
      - run: npm run db:migrate --prefix api-contract
      - run: npm run db:seed --prefix api-contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-front-browser-validation
          path: |
            playwright-report/
            test-results/
